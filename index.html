<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hambre Cerca</title>
<meta name="description" content="Encuentra restaurantes, bares y cafeterías cerca de ti.">
<meta name="theme-color" content="#d7362b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hambre Cerca">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d7362b'/%3E%3Ccircle cx='32' cy='32' r='18' fill='%23fff'/%3E%3Ccircle cx='32' cy='32' r='11' fill='none' stroke='%23ffc531' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de una columna; cabecera roja con mantel de cuadros y toldo festoneado, tarjetas tipo ticket de comanda */
:root{
  --bg:#fbf3e8; --surface:#ffffff; --ink:#2b1d14; --muted:#7a6656; --line:#ecdcc8; --plate:#fff0d4;
  --tomato:#d7362b; --tomato-ink:#ffffff; --mustard:#ffc531; --on-mustard:#2b1d14;
  --open:#2f8f46; --closed:#c0392b; --check:rgba(255,255,255,.16);
  --display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c1411; --surface:#271c17; --ink:#f6ece2; --muted:#bba591; --line:#3d2d24; --plate:#3a2a20;
  --tomato:#a92a21; --tomato-ink:#fff6ee; --mustard:#ffc531; --on-mustard:#2b1d14;
  --open:#5cc77a; --closed:#ff8a7a; --check:rgba(255,255,255,.08); color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;color:var(--tomato-ink);padding-top:env(safe-area-inset-top,0px);
  background-color:var(--tomato);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 50%),linear-gradient(var(--check) 50%,transparent 50%);
  background-size:26px 26px;margin-bottom:14px}
header::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:radial-gradient(circle at 12px 0,var(--tomato) 12px,transparent 12.5px) 0 0/24px 12px repeat-x;
  filter:drop-shadow(0 3px 2px rgba(60,20,10,.18))}
header .wrap{padding-block:14px 14px;display:grid;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 1.9rem/1 var(--display);letter-spacing:.01em;margin:0;text-shadow:0 2px 0 rgba(0,0,0,.18)}
h1 span{color:var(--mustard)}
.loc{background:rgba(0,0,0,.18);border:0;color:var(--tomato-ink);font:600 .82rem var(--body);padding:7px 11px;border-radius:999px;cursor:pointer;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;gap:8px;background:#fff;border-radius:999px;padding:5px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.search input{flex:1;min-width:0;font:500 1.05rem var(--body);padding:10px 14px;border:0;background:transparent;color:#2b1d14;outline:none}
.search input::placeholder{color:#9b8676}
.search button{font:400 1.05rem var(--display);letter-spacing:.02em;padding:0 18px;border-radius:999px;border:0;background:var(--mustard);color:var(--on-mustard);cursor:pointer}
.search:focus-within{box-shadow:0 0 0 3px var(--mustard),0 4px 0 rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:2px 2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 .9rem var(--body);padding:7px 12px;border-radius:999px;border:0;background:#fff;color:#2b1d14;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:6px}
.chip .e{font-size:1.05rem;line-height:1}
.chip[aria-pressed="true"]{background:var(--mustard);color:var(--on-mustard)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:12px 8px;color:var(--muted);font-size:.9rem}
.bar label{display:flex;align-items:center;gap:6px}
.bar select{font:600 .9rem var(--body);padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar .count{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--tomato)}
ul{list-style:none;margin:0;padding:0 0 32px;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;box-shadow:0 2px 0 var(--line)}
.emo{width:52px;height:52px;border-radius:50%;background:var(--plate);display:grid;place-items:center;font-size:1.7rem;line-height:1;box-shadow:inset 0 0 0 4px var(--surface),0 0 0 1px var(--line)}
.body{display:grid;gap:5px;min-width:0}
.row1{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.name{font:400 1.2rem/1.15 var(--display);letter-spacing:.01em;margin:0;min-width:0;overflow-wrap:anywhere}
.dist{flex:none;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;background:var(--mustard);color:var(--on-mustard);padding:3px 9px;border-radius:999px}
.meta{color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pill{font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid currentColor}
.pill.open{color:var(--open)} .pill.closed{color:var(--closed)}
.addr{color:var(--muted);font-size:.88rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;padding-top:10px;border-top:2px dashed var(--line)}
.actions a{font:700 .88rem var(--body);text-decoration:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);color:var(--ink);background:var(--surface)}
.actions a.primary{background:var(--tomato);color:var(--tomato-ink);border-color:var(--tomato)}
.actions a:focus-visible,.chip:focus-visible,button:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.state{text-align:center;padding:40px 12px;color:var(--muted);display:grid;gap:12px;justify-items:center}
.state strong{color:var(--ink);font:400 1.35rem var(--display)}
.state button{font:400 1.05rem var(--display);padding:11px 18px;border-radius:999px;border:0;background:var(--tomato);color:var(--tomato-ink);cursor:pointer}
.manual{display:flex;gap:8px;width:100%;max-width:420px}
.manual input{flex:1;min-width:0;font:500 1rem var(--body);padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.spin{font-size:2.4rem;line-height:1;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-12deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.notice{background:var(--surface);border:2px dashed var(--mustard);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px;font-size:.92rem}
.notice[hidden]{display:none}
.notice p{margin:0}
.notice .howto{color:var(--muted)}
.nbtns{display:flex;flex-wrap:wrap;gap:8px}
.nbtns button{font:700 .9rem var(--body);padding:9px 13px;border-radius:999px;border:0;background:var(--mustard);color:var(--on-mustard);cursor:pointer}
.nbtns button.ghost{background:none;border:1.5px solid var(--line);color:var(--ink)}
footer{color:var(--muted);font-size:.78rem;text-align:center;padding-block:0 28px}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Hambre <span>Cerca</span></h1>
      <button class="loc" id="locBtn" type="button" title="Cambiar ubicación">📍 Buscando…</button>
    </div>
    <form class="search" id="form" autocomplete="off">
      <input id="q" type="search" enterkeyhint="search" placeholder="¿Qué te apetece? pizza, sushi, tapas…" aria-label="Qué quieres comer">
      <button type="submit">Buscar</button>
    </form>
    <div class="chips" id="chips" role="group" aria-label="Búsquedas rápidas"></div>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <label>Radio
      <select id="radius">
        <option value="500">500 m</option>
        <option value="1000" selected>1 km</option>
        <option value="2000">2 km</option>
        <option value="5000">5 km</option>
      </select>
    </label>
    <label class="toggle"><input type="checkbox" id="openOnly"> Solo abiertos</label>
    <span class="count" id="count"></span>
  </div>
  <div class="notice" id="notice" role="status" hidden></div>
  <ul id="list"></ul>
  <div class="state" id="state"></div>
</main>
<footer class="wrap">Datos de lugares © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">colaboradores de OpenStreetMap</a>. Las reseñas se abren en Google Maps.</footer>

<script>
(() => {
const $ = id => document.getElementById(id);
const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();

const QUICK = [["Todo","🍽️"],["Tapas","🥘"],["Pizza","🍕"],["Hamburguesa","🍔"],["Sushi","🍣"],["Café","☕"],["Brunch","🥐"],["Kebab","🥙"],["Chino","🍜"],["Mexicano","🌮"],["Vegano","🥗"],["Helado","🍦"],["Bar","🍺"]];

const AMENITY_ES = {restaurant:"Restaurante",fast_food:"Comida rápida",cafe:"Cafetería",bar:"Bar",pub:"Pub",ice_cream:"Heladería",food_court:"Zona de comidas",biergarten:"Cervecería"};
const CUISINE_ES = {pizza:"Pizza",italian:"Italiano",spanish:"Español",tapas:"Tapas",japanese:"Japonés",sushi:"Sushi",chinese:"Chino",burger:"Hamburguesas",kebab:"Kebab",mexican:"Mexicano",indian:"Indio",thai:"Tailandés",vietnamese:"Vietnamita",korean:"Coreano",american:"Americano",mediterranean:"Mediterráneo",regional:"Cocina regional",seafood:"Marisco",fish:"Pescado",chicken:"Pollo",sandwich:"Bocadillos",coffee_shop:"Café",breakfast:"Desayunos",brunch:"Brunch",ice_cream:"Helados",asian:"Asiático",peruvian:"Peruano",argentinian:"Argentino",steak_house:"Carnes",grill:"Parrilla",barbecue:"Barbacoa",vegetarian:"Vegetariano",vegan:"Vegano",greek:"Griego",french:"Francés",turkish:"Turco",lebanese:"Libanés",arab:"Árabe",venezuelan:"Venezolano",colombian:"Colombiano",ramen:"Ramen",noodle:"Fideos",bakery:"Panadería",crepe:"Crepes",donut:"Dónuts",paella:"Paella",basque:"Vasco",galician:"Gallego",catalan:"Catalán",asturian:"Asturiano",andalusian:"Andaluz",tex_mex:"Tex-Mex",cake:"Pasteles",juice:"Zumos",bubble_tea:"Bubble tea",chocolate:"Chocolatería",churros:"Churros",wine_bar:"Vinos",international:"Internacional",fusion:"Fusión",portuguese:"Portugués",brazilian:"Brasileño",cuban:"Cubano",moroccan:"Marroquí",pakistani:"Pakistaní",nepalese:"Nepalí",hawaiian:"Hawaiano",poke:"Poke",wok:"Wok",dumpling:"Dumplings",bagel:"Bagels",hot_dog:"Perritos",fish_and_chips:"Fish & chips",tea:"Té",friture:"Fritos"};

// sinónimos en español -> etiquetas OSM (cuisine) o tipos (amenity) o dieta
const SYN = [
  [["pizza","pizzeria","italiano","pasta"],{c:["pizza","italian"]}],
  [["sushi","japones","japo","ramen","poke"],{c:["sushi","japanese","ramen","poke"]}],
  [["hamburguesa","burger","hamburgueseria"],{c:["burger","american"]}],
  [["tapas","tapeo","espanol","menu del dia","menu","casero","paella"],{c:["tapas","spanish","regional","paella","mediterranean","basque","galician","catalan","asturian","andalusian"]}],
  [["chino","china","wok","asiatico"],{c:["chinese","asian","wok","dumpling","noodle"]}],
  [["mexicano","tacos","burrito","nachos"],{c:["mexican","tex_mex"]}],
  [["kebab","doner","turco","shawarma","durum"],{c:["kebab","turkish","lebanese","arab"]}],
  [["indio","curry","hindu"],{c:["indian","pakistani","nepalese"]}],
  [["vegano"],{c:["vegan"],d:"vegan"}],
  [["vegetariano","veggie"],{c:["vegetarian","vegan"],d:"vegetarian"}],
  [["cafe","cafeteria","coffee"],{c:["coffee_shop"],a:["cafe"]}],
  [["desayuno","brunch","tostada"],{c:["breakfast","brunch","coffee_shop"],a:["cafe"]}],
  [["helado","heladeria"],{c:["ice_cream"],a:["ice_cream"]}],
  [["bar","cerveza","copas","pub","vino"],{a:["bar","pub","biergarten"],c:["wine_bar"]}],
  [["marisco","pescado","mariscos"],{c:["seafood","fish"]}],
  [["carne","asador","parrilla","steak"],{c:["steak_house","grill","barbecue","argentinian"]}],
  [["pollo","pollo asado"],{c:["chicken"]}],
  [["bocadillo","sandwich","bocata"],{c:["sandwich","bagel"]}],
  [["comida rapida","rapida","fast food"],{a:["fast_food"]}],
  [["churros","chocolate"],{c:["churros","chocolate"]}],
  [["peruano","ceviche"],{c:["peruvian"]}],
  [["tailandes","thai"],{c:["thai"]}],
  [["coreano"],{c:["korean"]}],
  [["griego"],{c:["greek"]}],
  [["arabe","libanes","marroqui","falafel"],{c:["arab","lebanese","moroccan"]}]
];

let pos = null, placeLabel = "", places = [], lastKey = "";

function buildChips(){
  const box = $("chips");
  QUICK.forEach(([t,e])=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"; b.dataset.q=t;
    b.innerHTML='<span class="e" aria-hidden="true"></span><span></span>';
    b.firstChild.textContent=e; b.lastChild.textContent=t;
    b.setAttribute("aria-pressed", t==="Todo"?"true":"false");
    b.onclick=()=>{ $("q").value = t==="Todo"?"":t; render(); };
    box.appendChild(b);
  });
}
function syncChips(){
  const q=norm($("q").value);
  document.querySelectorAll(".chip").forEach(b=>{
    const t=norm(b.dataset.q);
    b.setAttribute("aria-pressed", (t==="todo"&&!q)||(t===q) ? "true":"false");
  });
}
function emojiFor(p){
  const c=p.cuisines, has=(...k)=>k.some(x=>c.includes(x));
  if(has("pizza","italian")) return "🍕";
  if(has("sushi","japanese","poke")) return "🍣";
  if(has("ramen","noodle","chinese","asian","wok","vietnamese","thai","korean","dumpling")) return "🍜";
  if(has("burger","american")) return "🍔";
  if(has("kebab","turkish","lebanese","arab","greek","moroccan")) return "🥙";
  if(has("mexican","tex_mex")) return "🌮";
  if(has("indian","pakistani","nepalese")) return "🍛";
  if(has("seafood","fish")) return "🦐";
  if(has("steak_house","grill","barbecue","argentinian")) return "🥩";
  if(has("chicken")) return "🍗";
  if(has("sandwich","bagel")) return "🥪";
  if(has("tapas","spanish","regional","paella","mediterranean","basque","galician","catalan","asturian","andalusian")) return "🥘";
  if(has("vegan","vegetarian")) return "🥗";
  if(has("ice_cream")||p.amenity==="ice_cream") return "🍦";
  if(has("breakfast","brunch")) return "🥐";
  if(has("cake","bakery","donut","churros","chocolate")) return "🍰";
  if(p.amenity==="cafe"||has("coffee_shop")) return "☕";
  if(["bar","pub","biergarten"].includes(p.amenity)) return "🍺";
  if(p.amenity==="fast_food") return "🍟";
  return "🍽️";
}

function haversine(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtDist = m => m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km";
const walkMin = m => Math.max(1,Math.round(m/80));

// ---- horario (formato opening_hours de OSM, casos habituales) ----
const DAYS=["Mo","Tu","We","Th","Fr","Sa","Su"];
function parseDays(sel){
  const set=new Set();
  for(const part of sel.split(",")){
    const m=part.trim().match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(Mo|Tu|We|Th|Fr|Sa|Su))?$/);
    if(!m) return null;
    let i=DAYS.indexOf(m[1]); const j=m[2]?DAYS.indexOf(m[2]):i;
    for(let k=0;k<7;k++){ set.add(i); if(i===j)break; i=(i+1)%7; }
  }
  return set;
}
function parseTimes(t){
  t=t.trim();
  if(/^(off|closed)$/i.test(t)) return [];
  const out=[];
  for(const r of t.split(",")){
    const m=r.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/);
    if(!m) return null;
    const s=+m[1]*60+ +m[2]; let e=+m[3]*60+ +m[4];
    if(e<=s) e+=1440;
    out.push([s,e]);
  }
  return out;
}
function isOpenNow(oh){
  if(!oh) return null;
  oh=oh.trim();
  if(oh==="24/7") return true;
  const sched=Array.from({length:7},()=>null);
  for(let rule of oh.split(";")){
    rule=rule.trim(); if(!rule) continue;
    if(/^(PH|SH)\b/.test(rule)) continue;
    let days, times;
    const m=rule.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su)(?:\s*-\s*(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)\s*(?:,\s*PH)?\s+(.*)$/);
    if(m){ days=parseDays(m[1].replace(/,\s*$/,"")); times=parseTimes(m[2]); }
    else { days=new Set([0,1,2,3,4,5,6]); times=parseTimes(rule); }
    if(!days||!times) return null;
    days.forEach(d=>sched[d]=times);
  }
  const now=new Date(); const d=(now.getDay()+6)%7; const min=now.getHours()*60+now.getMinutes();
  const today=sched[d], yest=sched[(d+6)%7];
  if(today===null && yest===null) return null;
  if(today && today.some(([s,e])=>min>=s&&min<e)) return true;
  if(yest && yest.some(([s,e])=>e>1440 && min<e-1440)) return true;
  return false;
}

// ---- búsqueda ----
function matcher(qRaw){
  const q=norm(qRaw);
  if(!q || q==="todo") return ()=>true;
  const cs=new Set(), as=new Set(), ds=new Set();
  for(const [keys,v] of SYN){
    if(keys.some(k=>k===q || (q.length>=3 && (k.startsWith(q)||q.startsWith(k))))){
      (v.c||[]).forEach(x=>cs.add(x)); (v.a||[]).forEach(x=>as.add(x)); if(v.d) ds.add(v.d);
    }
  }
  return p=>{
    if(norm(p.name).includes(q)) return true;
    if(p.cuisines.some(c=>cs.has(c) || norm(CUISINE_ES[c]||c).includes(q))) return true;
    if(as.has(p.amenity)) return true;
    for(const d of ds){ if(p.tags["diet:"+d]==="yes"||p.tags["diet:"+d]==="only") return true; }
    return false;
  };
}

const OVERPASS=["https://overpass-api.de/api/interpreter","https://z.overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const CACHE_MS=24*3600*1000;
function cacheGet(k){ try{ const v=JSON.parse(localStorage.getItem("hc:"+k)); if(v && Date.now()-v.t<CACHE_MS) return v.d; }catch(e){} return null; }
function cacheSet(k,d){ try{ localStorage.setItem("hc:"+k,JSON.stringify({t:Date.now(),d})); }catch(e){} }
// pide a todos los servidores a la vez y se queda con el primero que responda
function raceOverpass(q){
  const ctrls=OVERPASS.map(()=>new AbortController());
  const tm=setTimeout(()=>ctrls.forEach(c=>c.abort()),60000);
  return Promise.any(OVERPASS.map((u,i)=>
    fetch(u+"?data="+encodeURIComponent(q),{signal:ctrls[i].signal})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  )).then(j=>{ ctrls.forEach(c=>c.abort()); return j; }).finally(()=>clearTimeout(tm));
}
async function fetchPlaces(){
  const want=+$("radius").value;
  const r=Math.max(want,2000); // se descarga al menos 2 km y se filtra en el móvil
  const key=pos.lat.toFixed(3)+","+pos.lon.toFixed(3)+","+r;
  if(key===lastKey) return;
  let elements=cacheGet(key);
  if(!elements){
    showState("loading");
    const slow=setTimeout(()=>{ const sp=$("state").querySelector("span"); if(sp) sp.textContent="Los servidores de mapas gratuitos van lentos ahora mismo. Un momento…"; },6000);
    const q=`[out:json][timeout:50];nwr["amenity"~"^(restaurant|fast_food|cafe|bar|pub|ice_cream|food_court|biergarten)$"]["name"](around:${r},${pos.lat},${pos.lon});out center tags;`;
    try{
      const data=await raceOverpass(q);
      elements=data.elements.map(el=>({type:el.type,id:el.id,lat:el.lat??el.center?.lat,lon:el.lon??el.center?.lon,tags:el.tags||{}}));
      cacheSet(key,elements);
    }catch(e){ clearTimeout(slow); showState("error"); return; }
    clearTimeout(slow);
  }
  lastKey=key;
  places=elements.map(el=>{
    const lat=el.lat??el.center?.lat, lon=el.lon??el.center?.lon, t=el.tags||{};
    return {
      id:el.type+el.id, name:t.name, amenity:t.amenity, tags:t, lat, lon,
      cuisines:(t.cuisine||"").split(";").map(s=>s.trim().toLowerCase()).filter(Boolean),
      dist:haversine(pos,{lat,lon}), open:isOpenNow(t.opening_hours),
      addr:[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(", ")
    };
  }).filter(p=>p.lat!=null);
}

function render(){
  syncChips();
  if(!pos) return;
  const match=matcher($("q").value);
  const openOnly=$("openOnly").checked;
  const maxD=+$("radius").value;
  let list=places.filter(p=>p.dist<=maxD && match(p));
  if(openOnly) list=list.filter(p=>p.open===true);
  list.sort((a,b)=>{
    const oa=a.open===true?0:a.open===null?1:2, ob=b.open===true?0:b.open===null?1:2;
    if(Math.abs(a.dist-b.dist)<150 && oa!==ob) return oa-ob;
    return a.dist-b.dist;
  });
  const ul=$("list"); ul.innerHTML="";
  $("count").textContent = list.length ? list.length+(list.length===1?" sitio":" sitios") : "";
  if(!list.length){ showState(places.length?"empty":"none"); return; }
  $("state").hidden=true;
  for(const p of list.slice(0,80)){
    const li=document.createElement("li"); li.className="card";
    const kind=[AMENITY_ES[p.amenity]||"Local", ...p.cuisines.slice(0,2).map(c=>CUISINE_ES[c]||c.replace(/_/g," "))];
    const gq=encodeURIComponent(p.name+" "+(p.addr||"")).replace(/%20/g,"+");
    li.innerHTML=`<div class="emo" aria-hidden="true">${emojiFor(p)}</div><div class="body">
      <div class="row1"><h2 class="name"></h2><span class="dist">${fmtDist(p.dist)}</span></div>
      <div class="meta"><span class="kind"></span><span>· ${walkMin(p.dist)} min andando</span>${p.open===true?'<span class="pill open">Abierto</span>':p.open===false?'<span class="pill closed">Cerrado</span>':''}</div>
      ${p.addr?'<div class="addr"></div>':''}
      <div class="actions">
        <a class="primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${p.lat},${p.lon}">Cómo llegar</a>
        <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${gq}&center=${p.lat},${p.lon}">⭐ Ver reseñas</a>
        ${p.tags.phone||p.tags["contact:phone"]?`<a href="tel:${(p.tags.phone||p.tags["contact:phone"]).split(";")[0].replace(/\s/g,"")}">Llamar</a>`:""}
      </div></div>`;
    li.querySelector(".name").textContent=p.name;
    li.querySelector(".kind").textContent=[...new Set(kind)].join(" · ");
    if(p.addr) li.querySelector(".addr").textContent=p.addr;
    ul.appendChild(li);
  }
}

function showState(kind){
  const s=$("state"); s.hidden=false; $("list").innerHTML=""; $("count").textContent="";
  if(kind==="loading"){ s.innerHTML='<div class="spin" aria-hidden="true">🍳</div><span>Buscando sitios cerca…</span>'; return; }
  if(kind==="locating"){ s.innerHTML='<div class="spin" aria-hidden="true">📍</div><span>Pidiendo tu ubicación…</span>'; return; }
  if(kind==="error"){ s.innerHTML='<strong>No he podido cargar los sitios</strong><span>El servicio de mapas no responde. Prueba otra vez en un momento.</span><button type="button" id="retry">Reintentar</button>'; $("retry").onclick=()=>{lastKey="";go();}; return; }
  if(kind==="empty"){ s.innerHTML='<strong>Nada con ese nombre por aquí</strong><span>Prueba otra palabra o amplía el radio.</span>'; return; }
  if(kind==="none"){ s.innerHTML='<strong>No hay sitios en este radio</strong><span>Amplía el radio de búsqueda.</span>'; return; }
  if(kind==="noloc"){
    s.innerHTML='<strong>¿Dónde estás?</strong><span>Activa la ubicación o escribe una calle, barrio o ciudad.</span><button type="button" id="geo">📍 Usar mi ubicación</button><form class="manual" id="manual"><input id="place" placeholder="Ej.: Plaza Mayor, Madrid" aria-label="Lugar"><button type="submit">Ir</button></form>';
    $("geo").onclick=()=>locate(true);
    $("manual").onsubmit=e=>{e.preventDefault(); geocode($("place").value);};
  }
}

async function geocode(text){
  if(!text.trim()) return;
  showState("loading");
  try{
    const res=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=es&q="+encodeURIComponent(text));
    const j=await res.json();
    if(!j.length){ showState("noloc"); $("place").value=text; $("state").querySelector("span").textContent="No encuentro ese lugar. Prueba con más detalle (calle y ciudad)."; return; }
    setPos(+j[0].lat,+j[0].lon,j[0].display_name.split(",").slice(0,2).join(","));
  }catch(e){ showState("error"); }
}

function setPos(lat,lon,label){
  pos={lat,lon}; placeLabel=label; lastKey="";
  $("locBtn").textContent="📍 "+label;
  $("notice").hidden=true;
  try{ localStorage.setItem("hc-last",JSON.stringify({lat,lon,label})); }catch(e){}
  go();
}
const DENIED="Tu navegador tiene bloqueada la ubicación para esta web, por eso no te la pide.";
const HOWTO="Para activarla: toca el candado o «aA» junto a la dirección → Ubicación → Permitir, y recarga la página. En iPhone revisa también Ajustes → Privacidad → Localización → Safari → «Al usar la app». Si abriste el enlace desde WhatsApp o Instagram, ábrelo en Chrome o Safari.";
function showNotice(msg,howto){
  const n=$("notice"); n.hidden=false;
  n.innerHTML='<p><strong></strong></p>'+(howto?'<p class="howto"></p>':'')+'<div class="nbtns"><button type="button" id="exact">📍 Usar ubicación exacta</button><button type="button" id="pick" class="ghost">Elegir otro lugar</button></div>';
  n.querySelector("strong").textContent=msg;
  if(howto) n.querySelector(".howto").textContent=HOWTO;
  $("exact").onclick=()=>locate(true);
  $("pick").onclick=()=>{ pos=null; n.hidden=true; showState("noloc"); };
}
// ubicación aproximada por la conexión, sin permisos
async function approx(msg,howto){
  showState("locating");
  const srcs=[
    ["https://ipapi.co/json/",j=>[j.latitude,j.longitude,j.city]],
    ["https://ipwho.is/",j=>[j.latitude,j.longitude,j.city]],
    ["https://get.geojs.io/v1/ip/geo.json",j=>[+j.latitude,+j.longitude,j.city]]
  ];
  for(const [u,f] of srcs){
    try{
      const c=new AbortController(); setTimeout(()=>c.abort(),6000);
      const [lat,lon,city]=f(await (await fetch(u,{signal:c.signal})).json());
      if(isFinite(lat)&&isFinite(lon)){
        setPos(+lat,+lon,"Aprox.: "+(city||"tu zona"));
        showNotice(msg+" De momento uso tu ubicación aproximada (puede variar 1-2 km).",howto);
        return;
      }
    }catch(e){}
  }
  $("locBtn").textContent="📍 Elegir lugar"; showState("noloc"); showNotice(msg,howto);
}
async function locate(fromClick){
  if(!navigator.geolocation||!window.isSecureContext){ approx("Este navegador no permite usar la ubicación.",false); return; }
  let st="prompt";
  try{ st=(await navigator.permissions.query({name:"geolocation"})).state; }catch(e){}
  if(st==="denied" && !fromClick){ approx(DENIED,true); return; }
  showState("locating");
  navigator.geolocation.getCurrentPosition(
    p=>setPos(p.coords.latitude,p.coords.longitude,"Cerca de ti"),
    e=>{ if(e.code===1) approx(DENIED,true); else approx("No he podido obtener tu ubicación exacta (¿GPS desactivado?).",false); },
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
  );
}
async function go(){ await fetchPlaces(); render(); }

$("form").onsubmit=e=>{e.preventDefault(); $("q").blur(); render();};
$("q").addEventListener("input",()=>{ clearTimeout(window._t); window._t=setTimeout(render,200); });
$("radius").onchange=()=>{ if(pos) go(); };
$("openOnly").onchange=render;
$("locBtn").onclick=()=>{ pos=null; showState("noloc"); };

buildChips();
locate();
})();
</script>
